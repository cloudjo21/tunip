[project]
name = "tunip"
version = "0.2.5"
description = "tunip"
readme = "README.md"
requires-python = ">=3.13.9"
dependencies = [
    "bs4",
    "click==8.1.7",
    "datasets",
    "elasticsearch==8.6.0",
    "emoji==1.7.0",
    "fuzzywuzzy==0.18.0",
    "hdfs",
    "huggingface-hub>=0.1.0,<1.0",
    "nltk",
    "numpy==1.26.4",
    "omegaconf",
    "opensearch-py",
    "orjson",
    "pandas==2.1.4",
    "protobuf==4.25.1",
    "pyarrow",
    "pydantic==2.8.2",
    "pyspark==3.5.3",
    "python-Levenshtein",
    "pyyaml",
    "seqeval",
    "smart_open",
    "spacy==3.7.2",
    "termcolor",
    "toml",
    "pygsheets",
    "antlr4-python3-runtime",
    "boto3",
    "sqlalchemy",
    "matplotlib",
    "urllib3==1.26.13",
    "pendulum",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]
